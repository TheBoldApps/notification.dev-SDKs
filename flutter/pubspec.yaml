name: notification_dev
description: Thin Flutter wrapper for the notification.dev Android and iOS SDKs.
version: 0.2.0
homepage: https://notification.dev
repository: https://github.com/TheBoldApps/notification.dev-SDKs/tree/main/flutter
issue_tracker: https://github.com/TheBoldApps/notification.dev-SDKs/issues

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.notification.notification_dev
        pluginClass: NotificationDevPlugin
      ios:
        pluginClass: NotificationDevPlugin
