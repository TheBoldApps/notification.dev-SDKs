name: Expo SDK

on:
  pull_request:
    paths: ['expo/**', 'example/expo-example/**', '.github/workflows/expo.yml']
  push:
    branches: [main]
    paths: ['expo/**', 'example/expo-example/**', '.github/workflows/expo.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo/package-lock.json
      - run: npm ci
        working-directory: expo
      - run: npm test
        working-directory: expo
      - run: ruby test/spm_test.rb
        working-directory: expo
      - run: npm pack --dry-run
        working-directory: expo

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci && npm run build
        working-directory: expo
      - run: npm ci && npm run typecheck && npx expo prebuild --platform android --no-install
        working-directory: example/expo-example
      - run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a
        working-directory: example/expo-example/android

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci && npm run build
        working-directory: expo
      - run: npm ci && npx expo prebuild --platform ios --no-install
        working-directory: example/expo-example
      - run: pod install
        working-directory: example/expo-example/ios
      - run: xcodebuild -workspace notificationdevExample.xcworkspace -scheme notificationdevExample -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/notification-expo-build build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 -quiet
        working-directory: example/expo-example/ios
